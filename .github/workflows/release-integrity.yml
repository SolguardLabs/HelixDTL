name: Release integrity

on:
  push:
    branches: [main, production]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Validate protocol
        run: npm run ci
      - name: Verify published reference
        env:
          VERIFY_EVENT: ${{ github.event_name }}
          VERIFY_REF_TYPE: ${{ github.ref_type }}
          VERIFY_REF_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: python scripts/verify_published_ref.py
